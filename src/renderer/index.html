<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self' data:;">
<title>PantoScan</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="../../assets/icons/pantoscan.png" alt="PantoScan" width="38" height="38">
      <div>
        <h1>PantoScan</h1>
        <p id="dbpath" class="subtle">biblioteca local</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="llm-badge" class="badge badge-muted">LLM…</span>
      <span id="queue-badge" class="badge badge-muted">cola 0</span>
      <button id="project-guide" class="btn">Guía de proyecto</button>
      <button id="export-md" class="btn">Exportar .md</button>
      <button id="export-srt" class="btn">Exportar SRT</button>
      <button id="export-fcpxml" class="btn">Exportar FCPXML</button>
      <button id="run-all" class="btn btn-primary">Procesar todo</button>
    </div>
  </header>

  <div class="layout">
    <aside class="pane pane-sources">
      <div class="pane-head">
        <h2>Material</h2>
        <button id="add-source" class="btn btn-small">+ Carpeta</button>
      </div>
      <div id="sources" class="sources"></div>
      <p class="hint">Las carpetas se referencian en su sitio: no se copia nada.</p>
    </aside>

    <section class="pane pane-clips">
      <div class="pane-head">
        <h2>Clips <span id="clip-count" class="subtle"></span></h2>
        <div class="head-actions">
          <button id="select-all" class="btn btn-small">Todos</button>
          <button id="select-none" class="btn btn-small">Ninguno</button>
        </div>
      </div>
      <div class="searchbar">
        <input id="search-input" type="search" placeholder="Buscar en todo el material (frases, temas, emociones)…" autocomplete="off">
        <button id="search-clear" class="btn btn-small" hidden>Limpiar</button>
      </div>
      <div id="clips" class="clips"></div>
      <div class="pane-foot">
        <button id="run-selected" class="btn btn-primary">Procesar selección</button>
        <button id="cancel-run" class="btn" disabled>Cancelar</button>
        <span id="scan-status" class="subtle"></span>
      </div>
    </section>

    <section class="pane pane-guide">
      <div class="pane-head">
        <h2 id="guide-title">Guía de edición</h2>
        <div class="head-actions">
          <button id="edit-guide" class="btn btn-small" disabled>Editar</button>
          <button id="open-guide" class="btn btn-small" disabled>Abrir .md</button>
          <button id="open-folder" class="btn btn-small" disabled>Abrir carpeta</button>
        </div>
      </div>
      <div id="guide-files" class="files"></div>
      <iframe id="guide-frame" class="guide-frame" title="guía"></iframe>
      <div id="editor" class="editor" hidden></div>
      <div id="guide-empty" class="empty">
        <p>Selecciona un clip procesado para ver su guía.</p>
        <p class="subtle">La guía incluye temas, emociones en el tiempo, roles narrativos y guion de montaje con timecodes.</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
